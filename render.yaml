# Render Blueprint: New + > Blueprint > pick this repo > Apply
databases:
  - name: lostfound-db
    plan: free
    databaseName: lostfound
    user: lostfound

services:
  - type: web
    name: lost-and-found
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lostfound-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
